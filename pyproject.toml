[project]
name = "copilot"
version = "0.1.0"
description = "RAG + agent system answering EU AI Act and GDPR questions with article-level citations."
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.33.0",
    "groq>=1.7.0",
]

[build-system]
requires = ["uv_build>=0.10.6,<0.11.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
